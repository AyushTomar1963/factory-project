<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}jobhunt{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7fb; --panel: #fff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --brand: #4f46e5; --brand-ink: #fff; --ok: #059669; --warn: #d97706; --bad: #dc2626; --chip: #eef2ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  nav { background: #0f172a; color: #cbd5e1; padding: 22px 14px; position: sticky; top: 0; height: 100vh; }
  nav .logo { color: #fff; font-weight: 700; font-size: 18px; padding: 0 10px 18px; letter-spacing: .2px; }
  nav .logo span { color: #a5b4fc; }
  nav a { display: flex; justify-content: space-between; color: #cbd5e1; padding: 8px 10px; border-radius: 8px; margin-bottom: 2px; }
  nav a:hover, nav a.on { background: #1e293b; color: #fff; text-decoration: none; }
  nav .foot { position: absolute; bottom: 18px; left: 24px; right: 14px; font-size: 12px; color: #64748b; }
  main { padding: 28px 34px; max-width: 1200px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
  .grid { display: grid; gap: 14px; }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g2 { grid-template-columns: 1fr 1fr; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .btn { display: inline-block; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 7px 13px; border-radius: 8px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: #cbd5e1; text-decoration: none; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.bad { color: var(--bad); }
  .btn.sm { padding: 4px 9px; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .chip { display: inline-block; background: var(--chip); color: #3730a3; border-radius: 999px; padding: 1px 9px; font-size: 12px; margin: 0 4px 4px 0; }
  .chip.miss { background: #fef2f2; color: #991b1b; }
  .chip.gray { background: #f1f5f9; color: #475569; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #f1f5f9; color: #334155; white-space: nowrap; }
  .pill.shortlisted, .pill.approved { background: #e0e7ff; color: #3730a3; }
  .pill.tailored, .pill.draft { background: #fef3c7; color: #92400e; }
  .pill.contacted, .pill.sent, .pill.done { background: #d1fae5; color: #065f46; }
  .pill.filtered, .pill.skipped, .pill.rejected { background: #f1f5f9; color: #64748b; }
  .pill.bounced, .pill.failed { background: #fee2e2; color: #991b1b; }
  .score { font-variant-numeric: tabular-nums; font-weight: 600; }
  .bar { height: 6px; background: #e2e8f0; border-radius: 3px; width: 70px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--brand); }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs a { padding: 6px 12px; border-radius: 8px; color: var(--muted); }
  .tabs a.on { background: #fff; border: 1px solid var(--line); color: var(--ink); }
  .flash { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; }
  .warnbox { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 10px 14px; border-radius: 10px; }
  textarea, input[type=text], input[type=search] { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; }
  textarea { min-height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  pre.desc { white-space: pre-wrap; font: inherit; color: #334155; max-height: 420px; overflow: auto; margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .ok-t { color: var(--ok); font-weight: 600; } .bad-t { color: var(--bad); font-weight: 600; } .warn-t { color: var(--warn); font-weight: 600; }
  .counter { font-size: 12px; color: var(--muted); }
  @media (max-width: 900px) { .shell { grid-template-columns: 1fr; } nav { position: static; height: auto; } .g4, .g2 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <nav>
    <div class="logo">job<span>hunt</span></div>
    {% set p = request.url.path %}
    <a href="/" class="{{ 'on' if p == '/' }}">Overview</a>
    <a href="/jobs" class="{{ 'on' if p.startswith('/jobs') }}">Jobs</a>
    <a href="/outreach" class="{{ 'on' if p.startswith('/outreach') }}">Outreach review</a>
    <a href="/sending" class="{{ 'on' if p.startswith('/sending') }}">Sending &amp; deliverability</a>
    <div class="foot">Direct-to-ATS discovery.<br>Human-approved outreach.</div>
  </nav>
  <main>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% block body %}{% endblock %}
  </main>
</div>
</body>
</html>
