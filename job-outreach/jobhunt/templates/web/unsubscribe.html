<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe</title>
<style>
  body { font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7fb; color: #0f172a; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .box { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 32px 36px; max-width: 440px; text-align: center; }
  button { background: #4f46e5; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; cursor: pointer; }
  .muted { color: #64748b; }
</style>
</head>
<body>
  <div class="box">
    {% if done %}
      <h2>You're unsubscribed</h2>
      <p class="muted">{{ email }} won't receive any further messages{% if sender %} from {{ sender }}{% endif %}. Sorry for the interruption.</p>
    {% else %}
      <h2>Unsubscribe?</h2>
      <p class="muted">Stop all further messages{% if sender %} from {{ sender }}{% endif %} to {{ email }}.</p>
      <form method="post"><button>Unsubscribe</button></form>
    {% endif %}
  </div>
</body>
</html>
