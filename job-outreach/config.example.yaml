# Copy to config.yaml and edit. Everything under `targeting` can also be
# changed from the dashboard (Targeting & autopilot); dashboard edits win.

candidate:
  # Fallback master resume (JSON Resume). Importing your resume from the
  # dashboard's Resume crafter (or `jobhunt import-resume my.pdf`) overrides it.
  resume: examples/student_resume.json

targeting:
  seasons: [Summer 2027, Winter 2026]
  roles:
    - Software Engineering Intern
    - Backend Intern
    - Data Science Intern
  # Empty = anywhere.
  locations: []
  # Companies to cold-email about internships even without a posting:
  # "Name, domain" or just a domain.
  companies: []
  # hiring_posts:  LinkedIn posts by people hiring interns (via Apify Google search)
  # linkedin_jobs: LinkedIn internship listings, used to find who to email (via Apify)
  # companies:     the list above
  sources: [hiring_posts, linkedin_jobs, companies]
  max_results_per_query: 25
  require_season: false
  # Auto emailer
  auto_send: false          # true = approve + send drafts to verified addresses automatically
  cycle_every_hours: 24     # find + enrich + craft + draft this often
  tailor_per_cycle: 15      # resumes crafted per cycle
  per_tick: 3               # emails sent per /cron/tick call
  followups_enabled: true
  followup_after_days: 5

targets:
  # Who to email at a company, best first. Hiring-post authors always come first.
  titles:
    - Founder
    - Co-Founder
    - CTO
    - Head of Engineering
    - Engineering Manager
    - VP of Engineering
    - Talent Acquisition
    - Technical Recruiter
    - Recruiter
    - HR Manager
  max_contacts_per_company: 2
  # Confidence floor (0-100) for accepting a found address.
  min_email_confidence: 80

outreach:
  # Hard ceiling per sending domain per day (warm-up can lower it further).
  daily_cap: 25
  # Warm-up ramp keyed by days since the first send from this domain.
  warmup:
    - {from_day: 0, cap: 5}
    - {from_day: 7, cap: 10}
    - {from_day: 14, cap: 15}
    - {from_day: 21, cap: 20}
  # Random spacing between emails within one tick.
  min_delay_seconds: 20
  max_delay_seconds: 60
  # Don't start a new thread with the same person within this many days.
  recontact_after_days: 90
  # Pause automatically if the hard-bounce rate over the last 100 sends exceeds this.
  max_bounce_rate: 0.05
  # Refuse to send unless SPF, DKIM and DMARC are all published for the sender domain.
  require_authentication: true
  attach_resume: true
