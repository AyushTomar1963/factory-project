[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "0.1.0"
description = "Direct-to-ATS job discovery, fact-guarded resume tailoring and compliant low-volume outreach"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "Jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "dnspython>=2.6",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "weasyprint>=60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.setuptools.packages.find]
include = ["jobhunt*"]

[tool.setuptools.package-data]
jobhunt = ["templates/*.j2", "templates/web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
