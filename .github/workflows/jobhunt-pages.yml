name: jobhunt frontend → GitHub Pages

# Builds job-outreach/frontend and publishes it to the cursor/gh-pages-655c
# branch. In Settings → Pages choose "Deploy from a branch" → that branch, / (root).
on:
  push:
    branches: [master, cursor/job-outreach-system-655c]
    paths: ["job-outreach/frontend/**", ".github/workflows/jobhunt-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobhunt-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-outreach/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: job-outreach/frontend/package-lock.json
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Publish
        working-directory: job-outreach/frontend/dist
        run: |
          git init -q -b pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pages:cursor/gh-pages-655c
